# ═══════════════════════════════════════════════════════════════════════════
# FEATURE LISTS
# ═══════════════════════════════════════════════════════════════════════════
# All feature column names used across agents for ML models and data processing

feature_lists:
  # Agent 4 case-level features (33 features for ML scoring)
  case_features:
    - total_txn_amount_cbrt
    - avg_txn_amount_cbrt
    - std_txn_amount_cbrt
    - txn_count_log
    - txn_amount_cv
    - max_to_avg_txn_ratio
    - fund_exit_ratio
    - burst_score
    - time_to_first_outbound_minutes_log
    - txn_velocity_log
    - burst_per_age
    - distinct_counterparties_log
    - incoming_sources_count_log
    - counterparty_diversity_score
    - counterparty_to_txn_ratio
    - incoming_to_outgoing_ratio
    - alert_count
    - alert_density
    - alert_tier
    - kyc_x_alert
    - international_counterparty_flag
    - high_risk_country_flag
    - pep_flag
    - kyc_risk_score
    - kyc_risk_tier
    - historical_sar_flag
    - high_risk_combined
    - burst_x_exit
    - hr_country_x_exit
    - pep_x_intl
    - sar_history_x_kyc
    - fund_exit_tier
    - binary_risk_flag_count
    - crypto_transaction_count
    - crypto_total_volume_inr
    - crypto_velocity_score
    - high_risk_exchange_flag

  # Label columns (target variables)
  label_columns:
    - sar_worthy
    - typology_structuring
    - typology_rapid_movement
    - typology_funnel_account
    - typology_trade_based
    - typology_shell_company
    - typology_round_tripping
    - typology_crypto_structuring
    - typology_crypto_rapid_liquidation

  # Typology columns (subset of labels, excludes sar_worthy)
  typology_columns:
    - typology_structuring
    - typology_rapid_movement
    - typology_funnel_account
    - typology_trade_based
    - typology_shell_company
    - typology_round_tripping
    - typology_crypto_structuring
    - typology_crypto_rapid_liquidation

  # Binary risk flag features
  binary_features:
    - international_counterparty_flag
    - pep_flag
    - high_risk_country_flag
    - historical_sar_flag

  # Cube root transform columns
  cbrt_columns:
    - total_txn_amount
    - avg_txn_amount
    - std_txn_amount
    - max_txn_amount
    - min_txn_amount

  # Log1p transform columns
  log1p_columns:
    - time_to_first_outbound_minutes
    - txn_count
    - account_age_days
    - incoming_sources_count
    - txn_velocity
    - distinct_counterparties

# ═══════════════════════════════════════════════════════════════════════════
# TYPOLOGIES
# ═══════════════════════════════════════════════════════════════════════════
# All typology definitions with metadata, rules, and detection signals

typologies:
  structuring:
    label_column: typology_structuring
    display_name: "Structuring / Smurfing"
    description: "Breaking large transactions into smaller amounts to avoid CTR reporting thresholds"
    regulatory_references:
      - "PMLA Rule 3 - CTR threshold INR 10L"
      - "FATF-2005 §2.4 - Structuring patterns"
    rule_ids:
      - R-STR-01
      - R-STR-02
    detection_signals:
      - "Multiple transactions just below INR 10L threshold (900K-999K band)"
      - "Low coefficient of variation (CV < 0.15) indicating consistent sizing"
      - "High alert density relative to account age"
    risk_score: 0.75

  rapid_movement:
    label_column: typology_rapid_movement
    display_name: "Rapid Movement of Funds"
    description: "Quick movement of funds through accounts with minimal retention time"
    regulatory_references:
      - "FATF-2005 §2.2 - High velocity transfers"
      - "FATF-2005 §4.1 - Rapid fund exit patterns"
    rule_ids:
      - R-HVT-01
      - R-HVT-02
    detection_signals:
      - "High velocity score (> 0.75) on SWIFT wires"
      - "Outbound wire within hours of inbound credit"
      - "Fund exit ratio > 0.80"
    risk_score: 0.85

  layering:
    label_column: typology_funnel_account
    display_name: "Layering / Funnel Account"
    description: "Multiple incoming sources consolidated and moved through complex transaction chains"
    regulatory_references:
      - "FATF-2005 §3.1 - Multi-hop transfers"
      - "FATF-2005 §4.1 - Fan-in patterns"
      - "FATF-RECS R.16 - Cross-border layering"
    rule_ids:
      - R-LYR-01
      - R-IWT-01
    detection_signals:
      - "Multiple distinct incoming sources (> 4)"
      - "Internal transfers or RTGS multi-hop patterns"
      - "International wire transfers for cross-border layering"
    risk_score: 0.80

  tbml:
    label_column: typology_trade_based
    display_name: "Trade-Based Money Laundering (TBML)"
    description: "Money laundering through trade transactions using over/under-invoicing"
    regulatory_references:
      - "FATF-TBML §2.2 - Over/under-invoicing patterns"
      - "FATF-RECS R.19 - High-risk jurisdiction exposure"
    rule_ids:
      - R-TBM-01
      - R-IWT-02
    detection_signals:
      - "Round amounts (100K multiples) to foreign countries"
      - "Transactions with FATF high-risk jurisdictions (score > 0.50)"
      - "Cross-border transactions with pricing anomalies"
    risk_score: 0.82

  shell_company:
    label_column: typology_shell_company
    display_name: "Shell Company / Complex Structures"
    description: "Use of shell companies or complex ownership structures to obscure beneficial ownership"
    regulatory_references:
      - "FATF-SHELL §3.1 - Shell entity indicators"
      - "RBI-KYC S.38 - Enhanced due diligence for complex structures"
    rule_ids: []
    detection_signals:
      - "High number of distinct counterparties (> 12)"
      - "Multiple alerts (>= 3)"
      - "High-risk country exposure with PEP involvement"
    risk_score: 0.88

  round_tripping:
    label_column: typology_round_tripping
    display_name: "Round Tripping"
    description: "Funds sent abroad and returned as foreign investment to disguise domestic origin"
    regulatory_references:
      - "FATF-SHELL §4.2 - Round-trip capital flows"
    rule_ids: []
    detection_signals:
      - "Very high fund exit ratio (> 0.85)"
      - "High-risk country involvement"
      - "Delayed outbound flow pattern"
      - "High burst × exit interaction"
    risk_score: 0.90

  clean:
    label_column: null
    display_name: "Clean / No Typology"
    description: "No suspicious typology detected"
    regulatory_references: []
    rule_ids: []
    detection_signals: []
    risk_score: 0.0

  multi:
    label_column: null
    display_name: "Multiple Typologies"
    description: "Case exhibits characteristics of multiple typologies simultaneously"
    regulatory_references: []
    rule_ids:
      - R-STR-01
      - R-STR-02
      - R-HVT-01
      - R-HVT-02
    detection_signals:
      - "Triggers both structuring and rapid movement rules"
    risk_score: 0.90
  crypto_structuring:
    label_column: typology_crypto_structuring
    display_name: "Crypto Structuring"
    description: "Breaking large cryptocurrency purchases/sales into smaller amounts to avoid reporting thresholds or scrutiny"
    regulatory_references:
      - "FATF Guidance on VAs - Chapter 4"
    rule_ids:
      - R-CRYPTO-STR-01
    detection_signals:
      - "Multiple crypto transactions just below threshold"
      - "Consistent small-value crypto trades"
    risk_score: 0.78
  crypto_rapid_liquidation:
    label_column: typology_crypto_rapid_liquidation
    display_name: "Crypto Rapid Liquidation"
    description: "Rapid conversion of cryptocurrency to fiat followed by quick outbound transfers (e.g., wire) from the financial institution"
    regulatory_references:
      - "FATF Guidance on VAs - Chapter 4"
      - "FinCEN Advisory FIN-2021-A004"
    rule_ids:
      - R-CRYPTO-LIQ-01
    detection_signals:
      - "High crypto velocity score followed by fiat conversion"
      - "Outbound wire transfer within hours of crypto liquidation"
    risk_score: 0.87

